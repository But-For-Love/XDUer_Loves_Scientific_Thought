name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust（内核 / 命令行 / 桥接）
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: 格式检查
        run: cargo fmt --all -- --check

      - name: 编译全部目标
        run: cargo build --workspace --all-targets

      - name: 单元测试
        run: cargo test --workspace

  flutter:
    name: Flutter（界面 / 端到端构建）
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # cargokit 会用 rustup 编译 rust/，所以这里也要有 toolchain
      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: 取依赖
        run: flutter pub get

      - name: 静态检查
        run: flutter analyze

      - name: 界面测试
        run: flutter test

      - name: 出 Release 包
        run: flutter build windows --release
