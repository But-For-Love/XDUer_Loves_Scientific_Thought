name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: '要重新发布的 tag（必须已存在，如 v1.0.0）'
        required: true

permissions:
  contents: write

jobs:
  release:
    name: 出包并发布（windows-x64）
    runs-on: windows-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: 校验 tag 与版本号一致
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = $env:TAG.TrimStart('v')
          $line = Select-String -Path pubspec.yaml -Pattern '^version:\s*([^+\s]+)' | Select-Object -First 1
          if (-not $line) { throw 'pubspec.yaml 里没有 version 字段' }
          $ver = $line.Matches[0].Groups[1].Value
          if ($tag -ne $ver) { throw "tag $env:TAG 与 pubspec 版本 $ver 不一致" }
          "VERSION=$ver" >> $env:GITHUB_ENV

      - name: 打包
        shell: pwsh
        run: ./tool/package.ps1

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: xdxk-gui-${{ env.VERSION }}-windows-x64
          path: |
            dist/*.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error

      - name: 发布 Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          # 只传这两个，绝不 glob dist/（避免把 conf.json、旧包一起传上去）
          $assets = @("dist/xdxk-gui-$env:VERSION-windows-x64.zip", 'dist/SHA256SUMS.txt')
          foreach ($f in $assets) { if (-not (Test-Path $f)) { throw "缺少资产：$f" } }

          gh release view $env:TAG *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "release $env:TAG 已存在，覆盖上传资产"
            gh release upload $env:TAG @assets --clobber
            if ($LASTEXITCODE -ne 0) { throw 'gh release upload 失败' }
          } else {
            gh release create $env:TAG @assets `
              --title "$env:TAG — 西电选课（Windows x64）" `
              --generate-notes `
              --latest
            if ($LASTEXITCODE -ne 0) { throw 'gh release create 失败' }
          }
